<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Cyber Blue Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Cyber Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="300" fill="url(#bgGrad)"/>
  <rect width="1000" height="300" fill="url(#cyberGrid)"/>

  <!-- Decorative Cyber Glow Orbs -->
  <circle cx="150" cy="50" r="140" fill="#00f0ff" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="850" cy="220" r="160" fill="#6366f1" fill-opacity="0.09" filter="url(#glow)"/>

  <!-- Tech Accent Lines / Circuits -->
  <g stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <path d="M 50 40 L 220 40 L 250 70 L 450 70" />
    <circle cx="50" cy="40" r="3" fill="#00f0ff" fill-opacity="0.6"/>
    <circle cx="450" cy="70" r="3" fill="#00f0ff" fill-opacity="0.6"/>

    <path d="M 950 260 L 780 260 L 750 230 L 580 230" />
    <circle cx="950" cy="260" r="3" fill="#38bdf8" fill-opacity="0.6"/>
    <circle cx="580" cy="230" r="3" fill="#38bdf8" fill-opacity="0.6"/>
  </g>

  <!-- Main Glassmorphic Container -->
  <rect x="40" y="30" width="920" height="240" rx="16" fill="url(#cardGrad)" stroke="#1e3a8a" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="40" y="30" width="920" height="240" rx="16" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Status Pill (Top Right) -->
  <g transform="translate(680, 52)">
    <rect x="0" y="0" width="250" height="30" rx="15" fill="#031525" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="18" cy="15" r="5" fill="#10b981" filter="url(#softGlow)"/>
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.5">OPEN TO SWE / AI ROLES</text>
  </g>

  <!-- Left Header Content -->
  <!-- Monospace Subtitle Tag -->
  <g transform="translate(80, 75)">
    <text font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="600" fill="#00f0ff" letter-spacing="2">
      &gt; CONST IDENTITY = "LEELA_RANGA_PRASAD"
    </text>
  </g>

  <!-- Main Name Header -->
  <g transform="translate(80, 125)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      LEELA RANGA PRASAD
    </text>
  </g>

  <!-- Title / Track -->
  <g transform="translate(80, 160)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="600" fill="url(#cyanGrad)" letter-spacing="0.2">
      AI Engineer &amp; Systems Architect
    </text>
    <text x="315" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#64748b">
      |
    </text>
    <text x="330" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="500" fill="#cbd5e1">
      Generative AI • Agentic Workflows • Cyber Threat Intel
    </text>
  </g>

  <!-- Highlight Badges Row -->
  <g transform="translate(80, 205)">
    <!-- Badge 1: SIH -->
    <rect x="0" y="0" width="165" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">🏆 SIH 2026 Team Lead</text>

    <!-- Badge 2: Google Rep -->
    <rect x="175" y="0" width="180" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="187" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#a78bfa">⚡ Google Student Rep</text>

    <!-- Badge 3: Education & CGPA -->
    <rect x="365" y="0" width="190" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="377" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#34d399">🎓 B.Tech AI &amp; DS (8.83 CGPA)</text>

    <!-- Badge 4: Location -->
    <rect x="565" y="0" width="125" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="577" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8">📍 India (IST)</text>
  </g>

  <!-- Bottom Cyber Accent Line -->
  <rect x="40" y="268" width="920" height="2" rx="1" fill="url(#cyanGrad)" fill-opacity="0.8" filter="url(#softGlow)"/>
</svg>
